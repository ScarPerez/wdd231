
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations and Transitions</title>
    <link rel="stylesheet" href="styles/animations.css">
</head>
<body>

    <h1>CSS Animations and Transitions</h1>

    <section>
        <h2>1. Loading Animation</h2>
        <div class="loader"></div>
        <p>This loader spins continuously.</p>
    </section>

    <section>
        <h2>2. Loading Transition</h2>
        <div class="loader-t"></div>
        <p>Hover over the loader to activate the transition.</p>
    </section>

</body>
</html>
