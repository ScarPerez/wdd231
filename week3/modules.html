<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WDD231 modular JavaScript activity">
  <title>WDD231 - JavaScript Modules</title>
  <link rel="stylesheet" href="styles/modules.css">
  <script type="module" src="scripts/modules.mjs"></script>
</head>
<body>
  <main>
    <h1 id="courseName"></h1>
    <h2 id="courseCode"></h2>

    <form id="enrollment">
      <p>Manage Student Enrollment</p>

      <label for="sectionNumber">Section Number:</label>
      <select id="sectionNumber"></select>

      <button type="button" id="enrollStudent">
        Enroll Student
      </button>

      <button type="button" id="dropStudent">
        Drop Student
      </button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Section Number</th>
          <th>Enrolled</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody id="sections"></tbody>
    </table>
  </main>
</body>
</html>
